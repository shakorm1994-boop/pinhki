/* ===== Premium visual layer — presentation only; game rules/engine remain unchanged ===== */
:root{--gold:#d7b66b;--gold-bright:#ffe7a0;--felt:#0b3a29;--panel-border:rgba(231,199,115,.34);--premium-shadow:0 18px 48px rgba(0,0,0,.32)}
html{background:#160e08;scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 50% -12%,#76512b 0%,#29190f 47%,#100a06 100%) fixed;letter-spacing:.05px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.18;background-image:linear-gradient(135deg,rgba(255,255,255,.035) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.035) 50%,rgba(255,255,255,.035) 75%,transparent 75%,transparent);background-size:7px 7px;mask-image:linear-gradient(to bottom,black,transparent 85%)}
#scr,#app{width:min(100%,900px);max-width:900px;padding:clamp(12px,3vw,28px);}
#scr{min-height:100vh;display:none;align-content:start}
#scr h1{font-size:clamp(36px,7vw,58px);line-height:1.25;filter:drop-shadow(0 5px 16px rgba(243,217,139,.12));margin:clamp(12px,3vw,28px) 0 10px}
#scr h1::after{content:"✦  ♠  ✦";display:block;font-size:13px;letter-spacing:7px;margin-top:8px;color:var(--gold);opacity:.9}
.hd{margin-bottom:18px}
.gc{position:relative;overflow:hidden;border:1px solid rgba(255,226,154,.72);border-radius:26px;padding:clamp(24px,5vw,40px) 20px;margin:18px 0;background:radial-gradient(ellipse at 50% 0%,rgba(45,143,99,.96),rgba(7,48,33,.98) 72%);box-shadow:0 14px 36px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.12),inset 0 -24px 44px rgba(0,0,0,.12)}
.gc::before{content:"";position:absolute;inset:8px;border:1px solid rgba(255,226,154,.18);border-radius:19px;pointer-events:none}
.gc::after{content:"✧";position:absolute;top:10px;left:16px;color:rgba(255,231,160,.7);font-size:22px}
.gc i{display:block;font-size:clamp(24px,5vw,34px);letter-spacing:9px;margin-bottom:7px;color:#ffe6a0}
.gc b{display:block;font-size:clamp(23px,5vw,31px);line-height:1.5;color:#fff1c7;text-shadow:0 2px 12px rgba(0,0,0,.28)}
.gc:hover:not(.lock){transform:translateY(-4px);box-shadow:0 20px 42px rgba(0,0,0,.48),0 0 0 1px rgba(255,231,160,.3),0 0 28px rgba(201,162,75,.18)}
.gc.lock{filter:saturate(.55);opacity:.7}
button{border-radius:15px;border-color:#f0d48a;box-shadow:0 4px 0 #73551b,0 9px 20px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.65);transition:transform .16s ease,filter .16s ease,box-shadow .16s ease}
button.g{border:1px solid rgba(231,199,115,.55);box-shadow:0 5px 15px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(8px)}
button:focus-visible,.gc:focus-visible,.m.can:focus-visible{outline:3px solid #fff0b7;outline-offset:3px}
#sc{gap:9px;padding:6px 4px 16px}
#sc>div{padding:10px 8px;border-radius:16px;border-color:rgba(255,231,160,.28);background:linear-gradient(155deg,rgba(22,77,56,.96),rgba(5,30,22,.98));box-shadow:0 8px 18px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08)}
#sc b{font-size:clamp(19px,3vw,25px)}
.table{border-radius:30px;padding:clamp(12px,2.5vw,20px);box-shadow:0 0 0 5px #68411f,0 0 0 7px #d9b765,0 0 0 11px #342013,0 24px 54px rgba(0,0,0,.5),inset 0 0 70px rgba(0,0,0,.38)}
